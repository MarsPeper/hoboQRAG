global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Scraping FastAPI Backend running natively on Windows host
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']

  # 2. Scraping vLLM Server running inside Docker container
  - job_name: 'vllm'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['vllm-server:8000']

  # 3. Scraping Qdrant Database running inside Docker container
  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant-db:6333']
